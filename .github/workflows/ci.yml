name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/repo
      PAYLOAD_SECRET: ci-only-secret
      PREVIEW_SECRET: ci-only-secret
      CRON_SECRET: ci-only-secret
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      NEXT_PUBLIC_S3_PUBLIC_URL: http://localhost:9000/fizz
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: fizz-dev-key
      GOOGLE_CLIENT_SECRET: fizz-dev-secret-key
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: docker compose --profile dev run --rm postgres
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-
      - run: bun install --frozen-lockfile
      - name: Generated files are up to date
        run: |
          bun run generate:types
          bun run generate:importmap
          git diff --exit-code -- dev/payload-types.ts 'dev/app/(payload)/admin/importMap.js'
      - run: bun run db:migrate
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun run test:int
      - run: bun run build
